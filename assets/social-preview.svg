<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="termChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#30363d" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Subtle top glow -->
  <ellipse cx="640" cy="-40" rx="600" ry="120" fill="#58a6ff" opacity="0.06"/>

  <!-- Accent line top -->
  <rect y="0" width="1280" height="3" fill="url(#glowLine)"/>

  <!-- ── TITLE ── -->
  <text x="640" y="88"
        text-anchor="middle"
        font-family="'SF Mono','Fira Code','Cascadia Code',monospace"
        font-size="80" font-weight="bold"
        fill="#e6edf3"
        filter="url(#softglow)">ll-lang</text>

  <!-- Subtitle -->
  <text x="640" y="128"
        text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="24"
        fill="#8b949e">Write once. Compile to anything. LLM-optimized.</text>

  <!-- ── TERMINAL WINDOW ── -->
  <rect x="48" y="162" width="590" height="390" rx="12"
        fill="#1e1e1e" filter="url(#shadow)"/>

  <!-- Terminal chrome -->
  <rect x="48" y="162" width="590" height="38" rx="12" fill="url(#termChrome)"/>
  <rect x="48" y="188" width="590" height="12" fill="#2d2d2d"/>

  <!-- Traffic lights -->
  <circle cx="74"  cy="181" r="7" fill="#ff5f57"/>
  <circle cx="98"  cy="181" r="7" fill="#febc2e"/>
  <circle cx="122" cy="181" r="7" fill="#28c840"/>

  <!-- Terminal title -->
  <text x="343" y="186"
        text-anchor="middle"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="13" fill="#8b949e">shape.lll</text>

  <!-- ── CODE (ll-lang source) ── -->
  <g font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="18">

    <!-- module Shapes -->
    <text x="80" y="230">
      <tspan fill="#c586c0">module</tspan>
      <tspan fill="#d4d4d4"> Shapes</tspan>
    </text>

    <!-- comment -->
    <text x="80" y="268" fill="#6a9955">-- algebraic data type</text>

    <!-- Shape = ... -->
    <text x="80" y="298">
      <tspan fill="#d4d4d4">Shape = </tspan>
      <tspan fill="#4ec9b0">Circle</tspan>
      <tspan fill="#d4d4d4"> Float</tspan>
    </text>
    <text x="80" y="326">
      <tspan fill="#d4d4d4">      | </tspan>
      <tspan fill="#4ec9b0">Rect</tspan>
      <tspan fill="#d4d4d4"> Float Float</tspan>
    </text>
    <text x="80" y="354">
      <tspan fill="#d4d4d4">      | </tspan>
      <tspan fill="#4ec9b0">Empty</tspan>
    </text>

    <!-- blank -->

    <!-- area function -->
    <text x="80" y="396">
      <tspan fill="#dcdcaa">area</tspan>
      <tspan fill="#d4d4d4">(s </tspan>
      <tspan fill="#4ec9b0">Shape</tspan>
      <tspan fill="#d4d4d4">) </tspan>
      <tspan fill="#4ec9b0">Float</tspan>
      <tspan fill="#d4d4d4"> =</tspan>
    </text>
    <text x="80" y="424">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">match</tspan>
      <tspan fill="#d4d4d4"> s</tspan>
    </text>
    <text x="80" y="452">
      <tspan fill="#d4d4d4">    | </tspan>
      <tspan fill="#4ec9b0">Circle</tspan>
      <tspan fill="#d4d4d4"> r -> </tspan>
      <tspan fill="#b5cea8">3.14</tspan>
      <tspan fill="#d4d4d4"> * r * r</tspan>
    </text>
    <text x="80" y="480">
      <tspan fill="#d4d4d4">    | </tspan>
      <tspan fill="#4ec9b0">Rect</tspan>
      <tspan fill="#d4d4d4"> w h -> w * h</tspan>
    </text>
    <text x="80" y="508">
      <tspan fill="#d4d4d4">    | </tspan>
      <tspan fill="#4ec9b0">Empty</tspan>
      <tspan fill="#d4d4d4">   -> </tspan>
      <tspan fill="#b5cea8">0.0</tspan>
    </text>
  </g>

  <!-- ── ARROWS ── -->
  <!-- Central arrow line -->
  <line x1="668" y1="357" x2="720" y2="357" stroke="#4ec9b0" stroke-width="2.5" opacity="0.8"/>
  <polygon points="720,350 736,357 720,364" fill="#4ec9b0" opacity="0.8"/>

  <!-- Small label above arrow -->
  <text x="694" y="344" text-anchor="middle"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="12" fill="#4ec9b0" opacity="0.7">lllc build</text>

  <!-- ── LANGUAGE CARDS ── -->
  <!-- F# -->
  <rect x="750" y="175" width="482" height="62" rx="8" fill="#1c2128" stroke="#378BBA" stroke-width="1.5"/>
  <rect x="750" y="175" width="8" height="62" rx="4" fill="#378BBA"/>
  <text x="778" y="213"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="20" font-weight="bold" fill="#378BBA">F#</text>
  <text x="840" y="213"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="16" fill="#8b949e">discriminated unions · .NET</text>
  <text x="1212" y="213" text-anchor="end"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="13" fill="#28c840">stable</text>

  <!-- TypeScript -->
  <rect x="750" y="253" width="482" height="62" rx="8" fill="#1c2128" stroke="#3178c6" stroke-width="1.5"/>
  <rect x="750" y="253" width="8" height="62" rx="4" fill="#3178c6"/>
  <text x="778" y="291"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="20" font-weight="bold" fill="#3178c6">TypeScript</text>
  <text x="908" y="291"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="16" fill="#8b949e">tagged unions · npm</text>
  <text x="1212" y="291" text-anchor="end"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="13" fill="#28c840">stable</text>

  <!-- Python -->
  <rect x="750" y="331" width="482" height="62" rx="8" fill="#1c2128" stroke="#3572a5" stroke-width="1.5"/>
  <rect x="750" y="331" width="8" height="62" rx="4" fill="#3572a5"/>
  <text x="778" y="369"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="20" font-weight="bold" fill="#f7cb4d">Python</text>
  <text x="878" y="369"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="16" fill="#8b949e">@dataclass + Union · pip</text>
  <text x="1212" y="369" text-anchor="end"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="13" fill="#28c840">stable</text>

  <!-- Java -->
  <rect x="750" y="409" width="482" height="62" rx="8" fill="#1c2128" stroke="#b07219" stroke-width="1.5"/>
  <rect x="750" y="409" width="8" height="62" rx="4" fill="#b07219"/>
  <text x="778" y="447"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="20" font-weight="bold" fill="#b07219">Java 21</text>
  <text x="876" y="447"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="16" fill="#8b949e">sealed interfaces</text>
  <text x="1212" y="447" text-anchor="end"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="13" fill="#28c840">stable</text>

  <!-- C# -->
  <rect x="750" y="487" width="482" height="62" rx="8" fill="#1c2128" stroke="#178600" stroke-width="1.5"/>
  <rect x="750" y="487" width="8" height="62" rx="4" fill="#178600"/>
  <text x="778" y="525"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="20" font-weight="bold" fill="#6bcb77">C#</text>
  <text x="822" y="525"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="16" fill="#8b949e">records + interfaces · NuGet</text>
  <text x="1212" y="525" text-anchor="end"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="13" fill="#28c840">stable</text>

  <!-- ── FOOTER ── -->
  <line x1="48" y1="574" x2="1232" y2="574" stroke="#30363d" stroke-width="1"/>

  <!-- Install commands — separate <text> per colour segment, pixel-exact positions -->
  <!-- char width = 15px × 0.6 = 9px; layout centred in x=130..894 -->
  <!-- Group 1: npm install -g @neftedollar/lllc (15+18 chars) -->
  <text x="130" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#6e7681">npm install -g </text>
  <text x="265" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#4ec9b0">@neftedollar/lllc</text>

  <!-- separator -->
  <text x="447" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#484e55">·</text>

  <!-- Group 2: pip install lllc (12+4 chars) -->
  <text x="467" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#6e7681">pip install </text>
  <text x="575" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#4ec9b0">lllc</text>

  <!-- separator -->
  <text x="631" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#484e55">·</text>

  <!-- Group 3: dotnet tool install -g lllc (23+4 chars) -->
  <text x="651" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#6e7681">dotnet tool install -g </text>
  <text x="858" y="608" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15" fill="#4ec9b0">lllc</text>

  <!-- GitHub link -->
  <text x="1216" y="608" text-anchor="end"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" fill="#30363d">github.com/Neftedollar/ll-lang</text>

  <!-- Accent line bottom -->
  <rect y="637" width="1280" height="3" fill="url(#glowLine)"/>
</svg>
