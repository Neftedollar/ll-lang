<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720">
  <defs>
    <style>
      text { font-family: 'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',monospace; font-size: 13.5px; }
      @keyframes p1 {
        0%   { opacity: 0; }
        4%   { opacity: 1; }
        45%  { opacity: 1; }
        50%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes p2 {
        0%,50% { opacity: 0; }
        54%    { opacity: 1; }
        95%    { opacity: 1; }
        100%   { opacity: 0; }
      }
      @keyframes blink {
        0%,49% { opacity: 1; }
        50%,100% { opacity: 0; }
      }
      .p1  { animation: p1  16s ease-in-out infinite; }
      .p2  { animation: p2  16s ease-in-out infinite; }
      .cur { animation: blink 1s step-end infinite; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#3c3c3c"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="712" height="372" rx="11" fill="#1e1e1e" filter="url(#shadow)"/>
  <rect width="720" height="40" rx="11" fill="url(#chrome)"/>
  <rect y="30" width="720" height="10" fill="#3c3c3c"/>

  <circle cx="22" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="7" fill="#febc2e"/>
  <circle cx="70" cy="20" r="7" fill="#28c840"/>

  <!-- TS badge in chrome -->
  <rect x="610" y="9" width="92" height="22" rx="4" fill="#3178c6"/>
  <text x="656" y="24" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">TypeScript</text>

  <text x="360" y="25" text-anchor="middle" fill="#9d9d9d" font-size="12.5">ll-lang → TypeScript</text>

  <!-- ══ PHASE 1: ll-lang source ══ -->
  <g class="p1">
    <text x="24" y="74">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">cat shape.lll</tspan>
    </text>

    <text x="24" y="108">
      <tspan fill="#c586c0">module</tspan>
      <tspan fill="#d4d4d4"> Shapes</tspan>
    </text>

    <text x="24" y="152" fill="#6a9955">-- sum type: algebraic data type</text>
    <text x="24" y="174">
      <tspan fill="#d4d4d4">Shape = </tspan>
      <tspan fill="#4ec9b0">Circle</tspan>
      <tspan fill="#d4d4d4"> Float | </tspan>
      <tspan fill="#4ec9b0">Rect</tspan>
      <tspan fill="#d4d4d4"> Float Float | </tspan>
      <tspan fill="#4ec9b0">Empty</tspan>
    </text>

    <text x="24" y="218" fill="#6a9955">-- exhaustive match (compiler enforces all cases)</text>
    <text x="24" y="240">
      <tspan fill="#dcdcaa">area</tspan>
      <tspan fill="#d4d4d4">(s </tspan>
      <tspan fill="#4ec9b0">Shape</tspan>
      <tspan fill="#d4d4d4">) </tspan>
      <tspan fill="#4ec9b0">Float</tspan>
      <tspan fill="#d4d4d4"> =</tspan>
    </text>
    <text x="24" y="262">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">match</tspan>
      <tspan fill="#d4d4d4"> s</tspan>
    </text>
    <text x="24" y="284">
      <tspan fill="#d4d4d4">    | </tspan>
      <tspan fill="#4ec9b0">Circle</tspan>
      <tspan fill="#d4d4d4"> r    -> </tspan>
      <tspan fill="#b5cea8">3.14159</tspan>
      <tspan fill="#d4d4d4"> * r * r</tspan>
    </text>
    <text x="24" y="306">
      <tspan fill="#d4d4d4">    | </tspan>
      <tspan fill="#4ec9b0">Rect</tspan>
      <tspan fill="#d4d4d4"> w h -> w * h</tspan>
    </text>
    <text x="24" y="328">
      <tspan fill="#d4d4d4">    | </tspan>
      <tspan fill="#4ec9b0">Empty</tspan>
      <tspan fill="#d4d4d4">   -> </tspan>
      <tspan fill="#b5cea8">0.0</tspan>
    </text>

    <text x="24" y="360">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build --target ts shape.lll</tspan>
      <tspan fill="#d4d4d4" class="cur">▌</tspan>
    </text>
  </g>

  <!-- ══ PHASE 2: TypeScript output ══ -->
  <g class="p2">
    <text x="24" y="74">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build --target ts shape.lll</tspan>
    </text>
    <text x="24" y="96">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#4ec9b0"> Built </tspan>
      <tspan fill="#dcdcaa">shape.ts</tspan>
    </text>

    <text x="24" y="140" fill="#6a9955">// shape.ts — generated by lllc</text>

    <text x="24" y="162">
      <tspan fill="#569cd6">type</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#4ec9b0">Shape</tspan>
      <tspan fill="#d4d4d4"> =</tspan>
    </text>
    <text x="24" y="184">
      <tspan fill="#d4d4d4">  | </tspan>
      <tspan fill="#d4d4d4">{ tag: </tspan>
      <tspan fill="#ce9178">"Circle"</tspan>
      <tspan fill="#d4d4d4">; _0: </tspan>
      <tspan fill="#4ec9b0">number</tspan>
      <tspan fill="#d4d4d4"> }</tspan>
    </text>
    <text x="24" y="206">
      <tspan fill="#d4d4d4">  | </tspan>
      <tspan fill="#d4d4d4">{ tag: </tspan>
      <tspan fill="#ce9178">"Rect"</tspan>
      <tspan fill="#d4d4d4">;   _0: </tspan>
      <tspan fill="#4ec9b0">number</tspan>
      <tspan fill="#d4d4d4">; _1: </tspan>
      <tspan fill="#4ec9b0">number</tspan>
      <tspan fill="#d4d4d4"> }</tspan>
    </text>
    <text x="24" y="228">
      <tspan fill="#d4d4d4">  | </tspan>
      <tspan fill="#d4d4d4">{ tag: </tspan>
      <tspan fill="#ce9178">"Empty"</tspan>
      <tspan fill="#d4d4d4"> };</tspan>
    </text>

    <text x="24" y="262">
      <tspan fill="#569cd6">function</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#dcdcaa">area</tspan>
      <tspan fill="#d4d4d4">(s: </tspan>
      <tspan fill="#4ec9b0">Shape</tspan>
      <tspan fill="#d4d4d4">): </tspan>
      <tspan fill="#4ec9b0">number</tspan>
      <tspan fill="#d4d4d4"> {</tspan>
    </text>
    <text x="24" y="284">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">if</tspan>
      <tspan fill="#d4d4d4"> (s.tag === </tspan>
      <tspan fill="#ce9178">"Circle"</tspan>
      <tspan fill="#d4d4d4">) </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#b5cea8">3.14159</tspan>
      <tspan fill="#d4d4d4"> * s._0 * s._0;</tspan>
    </text>
    <text x="24" y="306">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">if</tspan>
      <tspan fill="#d4d4d4"> (s.tag === </tspan>
      <tspan fill="#ce9178">"Rect"</tspan>
      <tspan fill="#d4d4d4">)   </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> s._0 * s._1;</tspan>
    </text>
    <text x="24" y="328">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#b5cea8">0</tspan>
      <tspan fill="#d4d4d4">;</tspan>
    </text>
    <text x="24" y="350" fill="#d4d4d4">}</text>
  </g>
</svg>
