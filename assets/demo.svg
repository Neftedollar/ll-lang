<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720">
  <defs>
    <style>
      text { font-family: 'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',monospace; font-size: 13.5px; }

      @keyframes p1 {
        0%   { opacity: 0; }
        4%   { opacity: 1; }
        22%  { opacity: 1; }
        25%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes p2 {
        0%,25% { opacity: 0; }
        29%    { opacity: 1; }
        47%    { opacity: 1; }
        50%    { opacity: 0; }
        100%   { opacity: 0; }
      }
      @keyframes p3 {
        0%,50% { opacity: 0; }
        54%    { opacity: 1; }
        72%    { opacity: 1; }
        75%    { opacity: 0; }
        100%   { opacity: 0; }
      }
      @keyframes p4 {
        0%,75% { opacity: 0; }
        79%    { opacity: 1; }
        97%    { opacity: 1; }
        100%   { opacity: 0; }
      }
      @keyframes blink {
        0%,49% { opacity: 1; }
        50%,100% { opacity: 0; }
      }
      @keyframes d1 {
        0%,3%  { opacity: 1; } 23% { opacity: 1; }
        25%    { opacity: 0.25; } 100% { opacity: 0.25; }
      }
      @keyframes d2 {
        0%,25% { opacity: 0.25; } 28% { opacity: 1; }
        47%    { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 0.25; }
      }
      @keyframes d3 {
        0%,50% { opacity: 0.25; } 53% { opacity: 1; }
        72%    { opacity: 1; } 75% { opacity: 0.25; } 100% { opacity: 0.25; }
      }
      @keyframes d4 {
        0%,75% { opacity: 0.25; } 78% { opacity: 1; }
        97%    { opacity: 1; } 100% { opacity: 0.25; }
      }

      .p1  { animation: p1  28s ease-in-out infinite; }
      .p2  { animation: p2  28s ease-in-out infinite; }
      .p3  { animation: p3  28s ease-in-out infinite; }
      .p4  { animation: p4  28s ease-in-out infinite; }
      .cur { animation: blink 1s step-end infinite; }
      .d1  { animation: d1  28s ease-in-out infinite; }
      .d2  { animation: d2  28s ease-in-out infinite; }
      .d3  { animation: d3  28s ease-in-out infinite; }
      .d4  { animation: d4  28s ease-in-out infinite; }
    </style>

    <!-- Shadow for terminal -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradient chrome -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#3c3c3c"/>
    </linearGradient>
  </defs>

  <!-- Terminal shell -->
  <rect x="4" y="4" width="712" height="432" rx="11" fill="#1e1e1e" filter="url(#shadow)"/>

  <!-- Chrome bar -->
  <rect width="720" height="40" rx="11" fill="url(#chrome)"/>
  <rect y="30" width="720" height="10" fill="#3c3c3c"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="7" fill="#febc2e"/>
  <circle cx="70" cy="20" r="7" fill="#28c840"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" fill="#9d9d9d" font-size="12.5">ll-lang — write once, compile to anything</text>

  <!-- ══════════════════════════════════════════
       PHASE 1 — ll-lang source code
       ══════════════════════════════════════════ -->
  <g class="p1">
    <!-- prompt -->
    <text x="24" y="74">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">cat fact.lll</tspan>
    </text>

    <!-- source: module -->
    <text x="24" y="108">
      <tspan fill="#c586c0">module</tspan>
      <tspan fill="#d4d4d4"> Factorial</tspan>
    </text>

    <!-- comment -->
    <text x="24" y="152" fill="#6a9955">-- factorial: recurse until base case</text>

    <!-- function signature -->
    <text x="24" y="174">
      <tspan fill="#dcdcaa">fact</tspan>
      <tspan fill="#d4d4d4">(n </tspan>
      <tspan fill="#4ec9b0">Int</tspan>
      <tspan fill="#d4d4d4">) </tspan>
      <tspan fill="#4ec9b0">Int</tspan>
      <tspan fill="#d4d4d4"> =</tspan>
    </text>

    <!-- if branch -->
    <text x="24" y="196">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">if</tspan>
      <tspan fill="#d4d4d4"> n &lt;= </tspan>
      <tspan fill="#b5cea8">1</tspan>
    </text>

    <!-- base case -->
    <text x="24" y="218" fill="#b5cea8">    1</text>

    <!-- recursive case -->
    <text x="24" y="240">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">else</tspan>
      <tspan fill="#d4d4d4"> n * </tspan>
      <tspan fill="#dcdcaa">fact</tspan>
      <tspan fill="#d4d4d4"> (n - </tspan>
      <tspan fill="#b5cea8">1</tspan>
      <tspan fill="#d4d4d4">)</tspan>
    </text>

    <!-- next command -->
    <text x="24" y="290">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build --target ts fact.lll</tspan>
      <tspan fill="#d4d4d4" class="cur">▌</tspan>
    </text>
  </g>

  <!-- ══════════════════════════════════════════
       PHASE 2 — TypeScript output
       ══════════════════════════════════════════ -->
  <g class="p2">
    <text x="24" y="74">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build --target ts fact.lll</tspan>
    </text>

    <!-- success -->
    <text x="24" y="96">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#4ec9b0"> Built </tspan>
      <tspan fill="#dcdcaa">fact.ts</tspan>
      <tspan fill="#555">  (TypeScript)</tspan>
    </text>

    <!-- ts output -->
    <text x="24" y="140" fill="#6a9955">// fact.ts — generated by lllc</text>

    <text x="24" y="162">
      <tspan fill="#569cd6">function</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#dcdcaa">fact</tspan>
      <tspan fill="#d4d4d4">(n: </tspan>
      <tspan fill="#4ec9b0">number</tspan>
      <tspan fill="#d4d4d4">): </tspan>
      <tspan fill="#4ec9b0">number</tspan>
      <tspan fill="#d4d4d4"> {</tspan>
    </text>

    <text x="24" y="184">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#569cd6">if</tspan>
      <tspan fill="#d4d4d4"> (n &lt;= </tspan>
      <tspan fill="#b5cea8">1</tspan>
      <tspan fill="#d4d4d4">) </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#b5cea8">1</tspan>
      <tspan fill="#d4d4d4">;</tspan>
    </text>

    <text x="24" y="206">
      <tspan fill="#d4d4d4">  </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> n * </tspan>
      <tspan fill="#dcdcaa">fact</tspan>
      <tspan fill="#d4d4d4">(n - </tspan>
      <tspan fill="#b5cea8">1</tspan>
      <tspan fill="#d4d4d4">);</tspan>
    </text>

    <text x="24" y="228" fill="#d4d4d4">}</text>

    <!-- badge -->
    <rect x="618" y="128" width="82" height="22" rx="4" fill="#3178c6" opacity="0.9"/>
    <text x="659" y="143" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">TypeScript</text>

    <!-- next command -->
    <text x="24" y="278">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build --target py fact.lll</tspan>
      <tspan fill="#d4d4d4" class="cur">▌</tspan>
    </text>
  </g>

  <!-- ══════════════════════════════════════════
       PHASE 3 — Python output
       ══════════════════════════════════════════ -->
  <g class="p3">
    <text x="24" y="74">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build --target py fact.lll</tspan>
    </text>

    <text x="24" y="96">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#4ec9b0"> Built </tspan>
      <tspan fill="#dcdcaa">fact.py</tspan>
      <tspan fill="#555">  (Python)</tspan>
    </text>

    <text x="24" y="140" fill="#6a9955"># fact.py — generated by lllc</text>

    <text x="24" y="162">
      <tspan fill="#569cd6">def</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#dcdcaa">fact</tspan>
      <tspan fill="#d4d4d4">(n: </tspan>
      <tspan fill="#4ec9b0">int</tspan>
      <tspan fill="#d4d4d4">) -&gt; </tspan>
      <tspan fill="#4ec9b0">int</tspan>
      <tspan fill="#d4d4d4">:</tspan>
    </text>

    <text x="24" y="184">
      <tspan fill="#d4d4d4">    </tspan>
      <tspan fill="#569cd6">if</tspan>
      <tspan fill="#d4d4d4"> n &lt;= </tspan>
      <tspan fill="#b5cea8">1</tspan>
      <tspan fill="#d4d4d4">: </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> </tspan>
      <tspan fill="#b5cea8">1</tspan>
    </text>

    <text x="24" y="206">
      <tspan fill="#d4d4d4">    </tspan>
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#d4d4d4"> n * </tspan>
      <tspan fill="#dcdcaa">fact</tspan>
      <tspan fill="#d4d4d4">(n - </tspan>
      <tspan fill="#b5cea8">1</tspan>
      <tspan fill="#d4d4d4">)</tspan>
    </text>

    <!-- badge -->
    <rect x="622" y="128" width="74" height="22" rx="4" fill="#3572a5" opacity="0.9"/>
    <text x="659" y="143" text-anchor="middle" fill="#f7cb4d" font-size="12" font-weight="bold">Python</text>

    <text x="24" y="256">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build fact.lll</tspan>
      <tspan fill="#d4d4d4" class="cur">▌</tspan>
    </text>
  </g>

  <!-- ══════════════════════════════════════════
       PHASE 4 — All targets at once
       ══════════════════════════════════════════ -->
  <g class="p4">
    <text x="24" y="74">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4">lllc build fact.lll</tspan>
    </text>

    <text x="24" y="96" fill="#555">Compiling for all configured targets...</text>

    <!-- F# -->
    <text x="24" y="136">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#dcdcaa">  fact.fs</tspan>
      <tspan fill="#555">     → F# discriminated unions</tspan>
    </text>
    <!-- TS -->
    <text x="24" y="162">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#dcdcaa">  fact.ts</tspan>
      <tspan fill="#555">     → TypeScript tagged unions</tspan>
    </text>
    <!-- Py -->
    <text x="24" y="188">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#dcdcaa">  fact.py</tspan>
      <tspan fill="#555">     → Python @dataclass + Union</tspan>
    </text>
    <!-- Java -->
    <text x="24" y="214">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#dcdcaa">  fact.java</tspan>
      <tspan fill="#555">   → Java 21 sealed interfaces</tspan>
    </text>
    <!-- C# -->
    <text x="24" y="240">
      <tspan fill="#28c840">✓</tspan>
      <tspan fill="#dcdcaa">  fact.cs</tspan>
      <tspan fill="#555">     → C# records + interfaces</tspan>
    </text>

    <!-- Final prompt -->
    <text x="24" y="290">
      <tspan fill="#4ec9b0">❯</tspan>
      <tspan fill="#dcdcaa"> ~/demo</tspan>
      <tspan fill="#888"> $ </tspan>
      <tspan fill="#d4d4d4" class="cur">▌</tspan>
    </text>
  </g>

  <!-- Progress dots -->
  <circle class="d1" cx="346" cy="420" r="5" fill="#4ec9b0"/>
  <circle class="d2" cx="362" cy="420" r="5" fill="#4ec9b0"/>
  <circle class="d3" cx="378" cy="420" r="5" fill="#4ec9b0"/>
  <circle class="d4" cx="394" cy="420" r="5" fill="#4ec9b0"/>
</svg>
