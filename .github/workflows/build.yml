name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  release-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Doc Contract Check
        run: ./tools/check-doc-contract.sh
      - name: Nullability Suppression Guard
        run: ./tools/check-no-fs3261-suppression.sh
      - name: Build
        run: dotnet clean --nologo && dotnet build --nologo -warnaserror
        working-directory: initial-compiler
      - name: Test (release-core)
        run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName!~ReverseTranspilerTests&FullyQualifiedName!~CodegenLLVMTests"
        working-directory: initial-compiler

  experimental:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet clean --nologo && dotnet build --nologo -warnaserror
        working-directory: initial-compiler
      - name: Test (reverse + llvm experimental)
        run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName~ReverseTranspilerTests|FullyQualifiedName~CodegenLLVMTests"
        working-directory: initial-compiler
