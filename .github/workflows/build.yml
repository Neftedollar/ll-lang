name: Self-host CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Self-host Check Suite
        run: |
          LLLC_BOOTSTRAP_REINSTALL=1 ./tools/check-selfhost-ci.sh
        working-directory: .
      - name: Self-host CLI E2E
        run: ./tools/check-selfhost-e2e.sh
        working-directory: .
      - name: LLVM Smoke Chain
        run: ./tools/check-llvm-smoke.sh
        working-directory: .
      - name: Doc Contract Check
        run: ./tools/check-doc-contract.sh
        working-directory: .
      - name: Nullability Suppression Guard
        run: ./tools/check-no-fs3261-suppression.sh
        working-directory: .
