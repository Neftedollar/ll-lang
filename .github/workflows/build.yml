name: Self-host CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Self-host Check Suite
        run: |
          LLLC_BOOTSTRAP_REINSTALL=1 ./tools/check-selfhost-ci.sh
        working-directory: .
      - name: Self-host CLI E2E
        run: ./tools/check-selfhost-e2e.sh
        working-directory: .
      - name: Self-host Multi-module Readiness
        run: ./tools/check-selfhost-multimodule.sh
        working-directory: .
      - name: Self-routing Smoke (safe preset)
        run: |
          tmp_dir="$(mktemp -d)"
          cat > "$tmp_dir/Smoke.lll" <<'SRC'
          module Smoke

          main() = printfn "smoke"
          SRC
          LLLC_BOOTSTRAP_SELF_PRESET=safe ./tools/lllc-bootstrap.sh check "$tmp_dir/Smoke.lll" | grep '"ok":true'
          LLLC_BOOTSTRAP_SELF_PRESET=safe ./tools/lllc-bootstrap.sh compile "$tmp_dir/Smoke.lll" | grep 'module Smoke'
        working-directory: .
      - name: Stage0 vs Self Parity Gate
        run: ./tools/check-stage0-self-parity.sh
        working-directory: .
      - name: LLVM Smoke Chain
        run: ./tools/check-llvm-smoke.sh
        working-directory: .
      - name: Doc Contract Check
        run: ./tools/check-doc-contract.sh
        working-directory: .
      - name: Nullability Suppression Guard
        run: ./tools/check-no-fs3261-suppression.sh
        working-directory: .
      - name: Release Readiness Contract
        run: ./tools/check-release-readiness.sh
        working-directory: .
