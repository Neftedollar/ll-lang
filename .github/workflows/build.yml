name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Doc Contract Check
        run: ./tools/check-doc-contract.sh
        working-directory: .
      - name: Build
        run: dotnet build --nologo -warnaserror
        working-directory: .
      - name: Test
        run: dotnet test --no-build --verbosity normal
        working-directory: .
