name: Release

on:
  push:
    tags: ["v*"]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ── 1. Compile .lll sources using published lllc ────────────────────────────
  #
  # This is the self-hosting bootstrap: the CURRENT published lllc compiles
  # the .lll sources into F#, TypeScript, and Python. Those become the NEXT version.
  compile:
    name: Compile .lll → all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install current lllc from NuGet
        run: dotnet tool install -g lllc

      - name: Compile lllcself → F# (full CLI with compiler + MCP)
        run: lllc build --target fs lllcself/src/Main.lll

      - name: Compile Compiler.lll → TypeScript
        run: lllc build --target ts stdlib/src/Compiler.lll

      - name: Bundle TypeScript → CJS
        run: node packages/npm/lllc/scripts/build-compiler.js

      - name: Compile Compiler.lll → Python
        run: |
          lllc build --target py stdlib/src/Compiler.lll
          cp stdlib/src/Compiler.py packages/pip/lllc/compiler.py

      - name: Upload F# output (for NuGet + binaries)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-fsharp
          path: |
            lllcself/src/*.fs
            lllcself/src/Main.fsproj
          retention-days: 1

      - name: Upload TypeScript output (for npm)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-typescript
          path: |
            packages/npm/lllc/lib/compiler.ts
            packages/npm/lllc/lib/compiler.cjs
          retention-days: 1

      - name: Upload Python output (for PyPI)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-python
          path: packages/pip/lllc/compiler.py
          retention-days: 1

  # ── 2. Build self-contained binaries from compiled F# ──────────────────────
  build-binary:
    name: Build (${{ matrix.rid }})
    needs: compile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download compiled F#
        uses: actions/download-artifact@v4
        with:
          name: compiled-fsharp
          path: lllcself/src/

      - name: Publish self-contained binary
        shell: bash
        run: |
          dotnet publish lllcself/src/Main.fsproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:AssemblyName=lllc \
            -o dist/${{ matrix.rid }}/

      - name: Archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: tar -czf lllc-${{ matrix.rid }}.tar.gz -C dist/${{ matrix.rid }} lllc

      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\${{ matrix.rid }}\lllc.exe `
            -DestinationPath lllc-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: lllc-${{ matrix.rid }}.${{ matrix.ext }}
          retention-days: 1

  # ── 3. Create GitHub Release and attach binaries ──────────────���────────────
  create-release:
    name: GitHub Release
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            lllc-linux-x64.tar.gz
            lllc-linux-arm64.tar.gz
            lllc-osx-x64.tar.gz
            lllc-osx-arm64.tar.gz
            lllc-win-x64.zip

  # ── 4. NuGet (from compiled F#, OIDC trusted publishing) ──────────────────
  publish-nuget:
    name: Publish NuGet
    needs: [create-release, compile]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download compiled F#
        uses: actions/download-artifact@v4
        with:
          name: compiled-fsharp
          path: lllcself/src/

      - name: Extract version
        id: ver
        run: echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare NuGet project
        run: |
          # Copy generated fsproj and add NuGet metadata
          FSPROJ=lllcself/src/Main.fsproj
          # Inject PackAsTool + NuGet metadata into the generated fsproj
          sed -i 's|</PropertyGroup>|    <AssemblyName>lllc</AssemblyName>\n    <PackAsTool>true</PackAsTool>\n    <ToolCommandName>lllc</ToolCommandName>\n    <PackageId>lllc</PackageId>\n    <Authors>Neftedollar</Authors>\n    <Description>lllc — compiler for ll-lang. Self-hosted: written in ll-lang, compiles to F#, TypeScript, Python, Java, C#.</Description>\n    <PackageLicenseExpression>MIT</PackageLicenseExpression>\n    <PackageReadmeFile>README.md</PackageReadmeFile>\n    <PackageTags>compiler;functional;llm;fsharp;typescript;python;java;csharp;codegen;dotnet-tool;cross-compile;multi-target;transpiler</PackageTags>\n    <PackageProjectUrl>https://github.com/Neftedollar/ll-lang</PackageProjectUrl>\n    <RepositoryUrl>https://github.com/Neftedollar/ll-lang</RepositoryUrl>\n    <RepositoryType>git</RepositoryType>\n  </PropertyGroup>|' "$FSPROJ"
          # Add README to package
          sed -i 's|</Project>|  <ItemGroup>\n    <None Include="../../README.md" Pack="true" PackagePath="/" />\n  </ItemGroup>\n</Project>|' "$FSPROJ"

      - name: Pack
        run: |
          dotnet pack lllcself/src/Main.fsproj \
            -c Release \
            -p:Version=${{ steps.ver.outputs.V }} \
            -o nuget-out/

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Neftedollar

      - name: Push to NuGet.org
        run: |
          dotnet nuget push nuget-out/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # ── 5. npm (OIDC trusted publishing) ─────��───────────────────────────────────
  publish-npm:
    name: Publish npm
    needs: [create-release, compile]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version
        id: ver
        run: echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download compiled TypeScript
        uses: actions/download-artifact@v4
        with:
          name: compiled-typescript
          path: packages/npm/lllc/lib/

      - name: Set package version
        working-directory: packages/npm/lllc
        run: npm version ${{ steps.ver.outputs.V }} --no-git-tag-version --allow-same-version

      - name: Publish (OIDC trusted publishing)
        working-directory: packages/npm/lllc
        run: |
          sed -i '/:_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npx npm@latest publish --provenance --access public

  # ── 6. PyPI (OIDC trusted publishing) ─────────────────────────────────────
  publish-pypi:
    name: Publish PyPI
    needs: [create-release, compile]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version
        id: ver
        run: echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download compiled Python
        uses: actions/download-artifact@v4
        with:
          name: compiled-python
          path: packages/pip/lllc/

      - name: Copy README for pip build
        run: cp README.md packages/pip/README.md

      - name: Stamp version
        working-directory: packages/pip
        run: |
          V=${{ steps.ver.outputs.V }}
          sed -i "s/^version = \".*\"/version = \"${V}\"/" pyproject.toml
          sed -i "s/^VERSION = \".*\"/VERSION = \"${V}\"/" lllc/_download.py
          sed -i "s/^__version__ = \".*\"/__version__ = \"${V}\"/" lllc/__init__.py

      - name: Build
        working-directory: packages/pip
        run: |
          pip install hatchling build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pip/dist/
