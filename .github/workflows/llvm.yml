name: LLVM SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/Platform.LLVM.SDK/**'
      - 'stdlib/src/CodegenLLVM.lll'
      - 'initial-compiler/src/**/CodegenLLVM.fs'
      - 'tools/llvm-*'
      - 'tools/lllc-native'
      - 'spec/examples/valid/[3-9][0-9]-llvm-*.lll'
      - '.github/workflows/llvm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/Platform.LLVM.SDK/**'
      - 'stdlib/src/CodegenLLVM.lll'
      - 'initial-compiler/src/**/CodegenLLVM.fs'
      - 'tools/llvm-*'
      - 'tools/lllc-native'
      - 'spec/examples/valid/[3-9][0-9]-llvm-*.lll'
      - '.github/workflows/llvm.yml'
  workflow_dispatch:

jobs:
  native-binary-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build bootstrap lllc
        run: dotnet build initial-compiler/src/LLLangTool/LLLangTool.fsproj -c Debug

      - name: Clean runtime (ensure Linux-built .o)
        run: make -C sdks/Platform.LLVM.SDK/runtime clean

      - name: Build 36-llvm-native-hello
        run: tools/lllc-native spec/examples/valid/36-llvm-native-hello.lll /tmp/hello

      - name: Run 36-llvm-native-hello
        run: |
          OUT=$(/tmp/hello)
          echo "stdout: $OUT"
          test "$OUT" = "Hello from native binary!" || { echo "expected 'Hello from native binary!'"; exit 1; }

      - name: Build 37-llvm-arith
        run: tools/lllc-native spec/examples/valid/37-llvm-arith.lll /tmp/arith

      - name: Run 37-llvm-arith
        run: |
          OUT=$(/tmp/arith)
          echo "stdout: $OUT"
          test "$OUT" = "42" || { echo "expected '42'"; exit 1; }

      - name: Build 38-llvm-conditional
        run: tools/lllc-native spec/examples/valid/38-llvm-conditional.lll /tmp/cond

      - name: Run 38-llvm-conditional
        run: |
          OUT=$(/tmp/cond)
          echo "stdout: $OUT"
          test "$OUT" = "13" || { echo "expected '13'"; exit 1; }

      - name: Build 39-llvm-strings
        run: tools/lllc-native spec/examples/valid/39-llvm-strings.lll /tmp/strings

      - name: Run 39-llvm-strings
        run: |
          OUT=$(/tmp/strings)
          echo "stdout: $OUT"
          test "$OUT" = "Hello, LLVM!" || { echo "expected 'Hello, LLVM!'"; exit 1; }

      - name: Build 40-llvm-recursion
        run: tools/lllc-native spec/examples/valid/40-llvm-recursion.lll /tmp/rec

      - name: Run 40-llvm-recursion
        run: |
          OUT=$(/tmp/rec)
          echo "stdout: $OUT"
          test "$OUT" = "120" || { echo "expected '120'"; exit 1; }

      - name: Build 41-llvm-adt-maybe
        run: tools/lllc-native spec/examples/valid/41-llvm-adt-maybe.lll /tmp/maybe

      - name: Run 41-llvm-adt-maybe
        run: |
          OUT=$(/tmp/maybe)
          echo "stdout: $OUT"
          EXPECTED=$'5\ndiv-by-zero'
          test "$OUT" = "$EXPECTED" || { echo "expected:"; echo "$EXPECTED"; exit 1; }

      - name: Build 42-llvm-adt-shape
        run: tools/lllc-native spec/examples/valid/42-llvm-adt-shape.lll /tmp/shape

      - name: Run 42-llvm-adt-shape
        run: |
          OUT=$(/tmp/shape)
          echo "stdout: $OUT"
          EXPECTED=$'30\n14\n0'
          test "$OUT" = "$EXPECTED" || { echo "expected:"; echo "$EXPECTED"; exit 1; }

      - name: Build 43-llvm-list-sum
        run: tools/lllc-native spec/examples/valid/43-llvm-list-sum.lll /tmp/listsum

      - name: Run 43-llvm-list-sum
        run: |
          OUT=$(/tmp/listsum)
          echo "stdout: $OUT"
          test "$OUT" = "15" || { echo "expected '15'"; exit 1; }

      - name: Build 44-llvm-list-map
        run: tools/lllc-native spec/examples/valid/44-llvm-list-map.lll /tmp/listmap

      - name: Run 44-llvm-list-map
        run: |
          OUT=$(/tmp/listmap)
          echo "stdout: $OUT"
          test "$OUT" = "2,4,6" || { echo "expected '2,4,6'"; exit 1; }

      - name: Build 45-llvm-list-of-maybe
        run: tools/lllc-native spec/examples/valid/45-llvm-list-of-maybe.lll /tmp/listmaybe

      - name: Run 45-llvm-list-of-maybe
        run: |
          OUT=$(/tmp/listmaybe)
          echo "stdout: $OUT"
          test "$OUT" = "1,X,3" || { echo "expected '1,X,3'"; exit 1; }

      - name: Build 46-llvm-readfile
        run: tools/lllc-native spec/examples/valid/46-llvm-readfile.lll /tmp/readfile

      - name: Run 46-llvm-readfile
        run: |
          echo "Hello from file" > /tmp/llvm-test-input.txt
          OUT=$(/tmp/readfile)
          echo "stdout: $OUT"
          test "$OUT" = "Hello from file" || { echo "expected 'Hello from file'"; exit 1; }

      - name: Build 47-llvm-writefile
        run: tools/lllc-native spec/examples/valid/47-llvm-writefile.lll /tmp/writefile

      - name: Run 47-llvm-writefile
        run: |
          rm -f /tmp/llvm-test-output.txt
          OUT=$(/tmp/writefile)
          echo "stdout: $OUT"
          test "$OUT" = "Written by native lllc" || { echo "expected 'Written by native lllc'"; exit 1; }
          FILE_CONTENTS=$(cat /tmp/llvm-test-output.txt)
          test "$FILE_CONTENTS" = "Written by native lllc" || { echo "expected file contents 'Written by native lllc', got: $FILE_CONTENTS"; exit 1; }

      - name: Build 48-llvm-cli-args
        run: tools/lllc-native spec/examples/valid/48-llvm-cli-args.lll /tmp/cliargs

      - name: Run 48-llvm-cli-args (with arg)
        run: |
          OUT=$(/tmp/cliargs hello)
          echo "stdout: $OUT"
          test "$OUT" = "hello" || { echo "expected 'hello'"; exit 1; }

      - name: Run 48-llvm-cli-args (no args)
        run: |
          OUT=$(/tmp/cliargs)
          echo "stdout: $OUT"
          test "$OUT" = "no args" || { echo "expected 'no args'"; exit 1; }

      - name: Run 48-llvm-cli-args (multiple args, head only)
        run: |
          OUT=$(/tmp/cliargs one two three)
          echo "stdout: $OUT"
          test "$OUT" = "one" || { echo "expected 'one' (first arg)"; exit 1; }
